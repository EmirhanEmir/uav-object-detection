name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Bağımlılıklar (yalnız lint)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e . --no-deps

      - name: Ruff
        run: ruff check .

      # Not: tests/ şimdilik push edilmiyor; testler geri gelince pytest adımı eklenecek.
