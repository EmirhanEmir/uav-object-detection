# Baseline deney konfigi — YOLO11s + P2 başlığı, tam kare (dilimleme YOK).
# Bu skor sonraki denemelerin (transfer, dilimleme, iyileştirme) referans noktası.
name: baseline-yolo11s-p2

model:
  arch: yolo11s              # n/s/m/l/x
  p2_head: true              # configs/yolo11-p2.yaml (stride-4 küçük nesne başlığı)
  pretrained: coco           # COCO ağırlığından fine-tune

data:
  yaml: configs/data.yaml
  imgsz: 1280                # tam kare letterbox; dilimleme ayrı bir deneme

train:
  epochs: 150
  batch: 32                  # ~40GB GPU @ imgsz 1280, yolo11s-p2 (-1 = otomatik)
  patience: 40               # early stop
  close_mosaic: 15           # son 15 epoch mozaik kapalı
  device: 0
  seed: 42
  project: runs/baseline
  workers: 8

eval:
  iou: 0.5
  # eğitim sonrası: Ultralytics val (hızlı) + kendi eval aracı (resmi referans)
  # scripts/predict_to_coco.py -> scripts/evaluate.py
  splits: [test]
