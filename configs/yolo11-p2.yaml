# YOLO11 + P2 (stride-4) tespit başlığı — küçük nesne (yukarıdan görünüm insan) için.
# Kaynak: Ultralytics yolo11.yaml omurgası + yolov8-p2.yaml kalıbıyla eklenen P2 başlığı.
# Detect artık 4 seviye: P2/4, P3/8, P4/16, P5/32.
# COCO ağırlığı `model.load("yolo11s.pt")` ile omurgaya (katman 0-10) transfer edilir;
# kaydırılan/yeni head katmanları sıfırdan başlar (kısmi transfer — baseline için kabul).

nc: 4  # sınıf: 0=vehicle 1=human 2=uap 3=uai (configs/data.yaml ile aynı)

scales:  # 'arch' anahtarına göre model derinlik/genişlik
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 2, C3k2, [512, False]]      # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 2, C3k2, [256, False]]      # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]        # cat backbone P2
  - [-1, 2, C3k2, [128, False]]      # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]       # cat head P3
  - [-1, 2, C3k2, [256, False]]      # 22 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]       # cat head P4
  - [-1, 2, C3k2, [512, False]]      # 25 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]       # cat head P5
  - [-1, 2, C3k2, [1024, True]]      # 28 (P5/32)

  - [[19, 22, 25, 28], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)
