# Faz 5b — dilimli (tiled) eğitim: Faz 4 (VisDrone transfer) çıktısından devam,
# tile boyutunda (1024, %30 overlap — sabitler.md C4) veriyle son fine-tune.
# Önce scripts/prepare_tiled_data.py ile configs/data_tiled.yaml üretilmiş olmalı.
# `pretrained` yolu Colab'daki Faz 4 çıktısına göre (aynı oturumda art arda çalıştırılır).
name: baseline-tiled-yolo11s-p2

model:
  arch: yolo11s
  p2_head: true
  pretrained: runs/faz4/baseline-visdrone-yolo11s-p2/weights/best.pt

data:
  yaml: configs/data_tiled.yaml
  imgsz: 1024        # tile boyutuyla aynı

train:
  epochs: 100         # dilimlenince veri seti büyüyor, daha az epoch yeterli olabilir
  batch: 32
  patience: 30
  close_mosaic: 10
  device: 0
  seed: 42
  project: runs/faz5
  workers: 8

eval:
  iou: 0.5
  splits: [val]       # data_tiled.yaml'da test yok — test/sanity hep tam-kare kalıyor
