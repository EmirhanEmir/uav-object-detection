# Transfer aşama 1 — ara-domain eğitim: COCO -> VisDrone-DET.
# Amaç 4 hedef sınıf değil; omurgayı drone bakışına ve küçük nesneye alıştırmak.
# Çıktı ağırlığı (best.pt) aşama 2'de (configs/baseline-visdrone.yaml) başlangıç noktası olur.
# VisDrone lisansı akademik / ticari olmayan kullanım içindir; bu ağırlıklar da aynı kısıta tabidir.
name: visdrone-pretrain-yolo11s-p2

model:
  arch: yolo11s
  p2_head: true
  pretrained: coco

data:
  yaml: VisDrone.yaml        # Ultralytics yerleşik config, ilk çalıştırmada otomatik indirir
  imgsz: 1280

train:
  epochs: 60
  batch: 32
  patience: 20
  close_mosaic: 10
  device: 0
  seed: 42
  project: runs/transfer
  workers: 8

eval:
  iou: 0.5
  splits: [test]
